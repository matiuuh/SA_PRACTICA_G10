services:

  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auth_service
    ports:
      - '5433:5432'
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
      - ./Backend/services/auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d auth_service']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - filmstars-network

  postgres-localidades:
    image: postgres:15-alpine
    container_name: postgres-localidades
