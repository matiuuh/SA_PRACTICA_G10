apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: filmstars
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: api-gateway
          image: ${REGISTRY_HOST}/filmstars-api-gateway:${IMAGE_TAG}
          ports:
            - containerPort: 3006
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: api-gateway-config
                  key: PORT
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: filmstars-config
                  key: FRONTEND_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: filmstars-config
                  key: AUTH_SERVICE_URL
            - name: LOCALIDADES_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: filmstars-config
                  key: LOCALIDADES_SERVICE_URL
            - name: FUNCIONES_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: filmstars-config
                  key: FUNCIONES_SERVICE_URL
            - name: RESERVAS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: filmstars-config
                  key: RESERVAS_SERVICE_URL
            - name: PAGOS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: filmstars-config
                  key: PAGOS_SERVICE_URL
          readinessProbe:
            tcpSocket:
              port: 3006
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3006
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
# ClusterIP: el tráfico externo llega via Ingress, no directamente a este Service.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: filmstars
spec:
  selector:
    app: api-gateway
  type: ClusterIP
  ports:
    - port: 3006
      targetPort: 3006
