# VITE_API_GATEWAY_URL se bake en tiempo de build (no en runtime).
# El pipeline lo pasa como build-arg con la URL del Ingress:
#   --build-arg VITE_API_GATEWAY_URL=http://<CLUSTER_IP>/api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: filmstars
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: frontend
          image: ${REGISTRY_HOST}/filmstars-frontend:${IMAGE_TAG}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: filmstars
spec:
  selector:
    app: frontend
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
