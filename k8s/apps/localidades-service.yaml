apiVersion: apps/v1
kind: Deployment
metadata:
  name: localidades-service
  namespace: filmstars
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localidades-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: localidades-service
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: localidades-service
          image: ${REGISTRY_HOST}/filmstars-localidades-service:${IMAGE_TAG}
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: localidades-service-config
                  key: PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: localidades-service-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: filmstars-config
                  key: DB_PORT
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: filmstars-config
                  key: DB_USERNAME
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: localidades-service-config
                  key: DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filmstars-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: filmstars-secrets
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: localidades-service
  namespace: filmstars
spec:
  selector:
    app: localidades-service
  type: ClusterIP
  ports:
    - port: 3002
      targetPort: 3002
