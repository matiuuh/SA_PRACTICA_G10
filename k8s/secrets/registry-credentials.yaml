# ──────────────────────────────────────────────────────────────────────────────
# PLANTILLA DE CREDENCIALES DEL REGISTRY PRIVADO (Harbor / Zot)
#
# El pipeline genera este secret con el comando:
#
#   kubectl create secret docker-registry registry-credentials \
#     --namespace filmstars \
#     --docker-server=${REGISTRY_HOST} \
#     --docker-username=${REGISTRY_USER} \
#     --docker-password=${REGISTRY_PASS} \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# O bien, reemplazar ${REGISTRY_AUTH_B64} con el JSON codificado en base64:
#   echo -n '{"auths":{"<REGISTRY_HOST>":{"username":"<USER>","password":"<PASS>","auth":"<base64(USER:PASS)>"}}}' | base64 -w0
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: filmstars
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ${REGISTRY_AUTH_B64}
