# ──────────────────────────────────────────────────────────────────────────────
# PLANTILLA DE SECRETOS — NO SUBIR CON VALORES REALES AL REPOSITORIO
#
# El pipeline de CI/CD reemplaza las variables ${..._B64} usando envsubst:
#
#   export POSTGRES_PASSWORD_B64=$(echo -n "$POSTGRES_PASSWORD" | base64 -w0)
#   export JWT_SECRET_B64=$(echo -n "$JWT_SECRET" | base64 -w0)
#   export RABBITMQ_USER_B64=$(echo -n "$RABBITMQ_USER" | base64 -w0)
#   export RABBITMQ_PASS_B64=$(echo -n "$RABBITMQ_PASS" | base64 -w0)
#   envsubst < k8s/secrets/app-secrets.yaml | kubectl apply -f -
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: filmstars-secrets
  namespace: filmstars
type: Opaque
data:
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_B64}
  JWT_SECRET: ${JWT_SECRET_B64}
  RABBITMQ_USER: ${RABBITMQ_USER_B64}
  RABBITMQ_PASS: ${RABBITMQ_PASS_B64}
