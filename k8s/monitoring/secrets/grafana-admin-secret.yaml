# Plantilla de secretos de Grafana.
# El pipeline de CI/CD debe inyectar los valores reales con envsubst.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
type: Opaque
data:
  admin-user: ${GRAFANA_ADMIN_USER_B64}
  admin-password: ${GRAFANA_ADMIN_PASSWORD_B64}
