# PUBLIC_HOST se inyecta en el pipeline de release como:
#   <k3s_master_ip>.sslip.io
#
# sslip.io resuelve automaticamente ese hostname a la IP publica, por lo que
# no se necesita comprar dominio. cert-manager emite un certificado valido con
# Let's Encrypt y el navegador habilita getUserMedia para la camara.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: filmstars-ingress
  namespace: filmstars
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${PUBLIC_HOST}
      secretName: filmstars-tls
  rules:
    - host: ${PUBLIC_HOST}
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: reservas-service
                port:
                  number: 3004
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3006
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
