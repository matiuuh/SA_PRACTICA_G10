# ──────────────────────────────────────────────────────────────────────────────
# Ingress Controller — nginx-ingress (instalable en K3s con):
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
#
# Traefik (default K3s): cambiar ingressClassName: traefik y eliminar
# la anotación nginx.ingress.kubernetes.io/rewrite-target.
#
# Routing:
#   /api/*  →  api-gateway:3006  (se preserva el prefijo /api)
#   /*      →  frontend:80
# ──────────────────────────────────────────────────────────────────────────────

# Ingress para el API Gateway preservando el prefijo /api
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: filmstars
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3006

---
# Ingress para el Frontend (catch-all, debe ir después del de la API)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: filmstars
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
