---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all installed packages
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - unzip
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
    state: present

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC
