    ports:
      - '3003:3003'
    depends_on:
      postgres-funciones:
        condition: service_healthy
    networks:
      - filmstars-network

  postgres-funciones:
    image: postgres:15-alpine
    container_name: postgres-funciones
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: funciones_db
    ports:
      - '5435:5432'
    volumes:
      - pgdata-funciones:/var/lib/postgresql/data
      - ./services/funciones-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d funciones_db']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - filmstars-network

  # ─── RESERVAS SERVICE ────────────────────────────────────────────
  reservas-service:
    build:
      context: ./services/reservas-service
    container_name: reservas-service
    env_file:
      - ./services/reservas-service/.env
    ports:
      - '3004:3004'
    depends_on:
      postgres-reservas:
        condition: service_healthy
    networks:
      - filmstars-network

  postgres-reservas:
    image: postgres:15-alpine
    container_name: postgres-reservas
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reservas_service
    ports:
      - '5436:5432'
    volumes:
      - pgdata-reservas:/var/lib/postgresql/data
      - ./services/reservas-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d reservas_service']
