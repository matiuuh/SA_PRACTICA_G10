services:

  # ─── AUTH SERVICE ───────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
    container_name: auth-service
    env_file:
      - ./services/auth-service/.env
    ports:
      - '3001:3001'
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - filmstars-network

  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_service
    ports:
      - '5433:5432'
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
      - ./services/auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d auth_service']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - filmstars-network

  # ─── LOCALIDADES SERVICE ─────────────────────────────────────────
  localidades-service:
    build:
      context: ./services/localidades-service
    container_name: localidades-service
    env_file:
      - ./services/localidades-service/.env
    ports:
      - '3002:3002'
    depends_on:
      postgres-localidades:
        condition: service_healthy
    networks:
      - filmstars-network

  postgres-localidades:
    image: postgres:15-alpine
    container_name: postgres-localidades
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: localidades_service
    ports:
      - '5434:5432'
    volumes:
      - pgdata-localidades:/var/lib/postgresql/data
      - ./services/localidades-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d localidades_service']
