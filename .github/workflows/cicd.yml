name: CI/CD FilmStars

# ──────────────────────────────────────────────────────────────────────────────
# Infraestructura y configuracion se hacen manualmente con Terraform y Ansible.
# Este pipeline solo construye imagenes, las publica y las despliega.
#
#   develop → Test → Build & Push DockerHub → SSH deploy en VM (docker compose)
#   release → Test → Build & Push Zot       → kubectl apply en K3s
#
# Secrets requeridos:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   EC2_HOST, EC2_SSH_PRIVATE_KEY
#   REGISTRY_HOST, REGISTRY_USER, REGISTRY_PASS
#   K3S_INGRESS_HOST, KUBECONFIG_B64
#   DB_HOST  (IP privada VM de BDs, para inyectar en ConfigMaps de K3s)
#   POSTGRES_PASSWORD, JWT_SECRET, RABBITMQ_USER, RABBITMQ_PASS
#   INTERNAL_SERVICE_TOKEN
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [release, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # FASE 1 — TEST (ambas ramas)
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: "Test ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - auth-service
          - localidades-service
          - funciones-service
          - reservas-service
          - pagos-service
          - escaneo-service
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        working-directory: Backend/services/${{ matrix.service }}
        run: npm install --legacy-peer-deps

      - name: Ejecutar tests
        working-directory: Backend/services/${{ matrix.service }}
        run: npm run test:cov

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: Backend/services/${{ matrix.service }}/coverage/
          retention-days: 14

  # ════════════════════════════════════════════════════════════════════════════
  # FASE 2a — BUILD & PUSH A DOCKERHUB (solo develop)
  # ════════════════════════════════════════════════════════════════════════════
  build-push-develop:
    name: "Build & Push DockerHub (develop)"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push auth-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/auth-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-auth-service:latest

      - name: Build y push localidades-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/localidades-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-localidades-service:latest

      - name: Build y push funciones-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/funciones-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-funciones-service:latest

      - name: Build y push reservas-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/reservas-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-reservas-service:latest

      - name: Build y push pagos-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/pagos-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-pagos-service:latest

      - name: Build y push escaneo-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/escaneo-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-escaneo-service:latest

      - name: Build y push api-gateway
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-api-gateway:latest

      - name: Build y push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_GATEWAY_URL=http://${{ secrets.EC2_HOST }}:3006
            VITE_RESERVAS_WS_URL=ws://${{ secrets.EC2_HOST }}:3004
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-frontend:latest

  # ════════════════════════════════════════════════════════════════════════════
  # FASE 3a — DEPLOY EN VM DEVELOP vía SSH (solo develop)
  # Ansible ya dejó todo configurado: .env, docker-compose.yml, Docker.
  # Aquí solo se halan las imágenes nuevas y se reinician los contenedores.
  # ════════════════════════════════════════════════════════════════════════════
  deploy-develop:
    name: "Deploy VM Develop (docker compose)"
    runs-on: ubuntu-latest
    needs: build-push-develop
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: SSH deploy en VM develop
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: EC2_HOST
          script: |
            cd /opt/filmstars
            grep -q '^FRONTEND_URL=' .env || echo "FRONTEND_URL=http://${EC2_HOST}:5173" >> .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

  # ════════════════════════════════════════════════════════════════════════════
  # FASE 2b — BUILD & PUSH A REGISTRY PRIVADO ZOT (solo release)
  # ════════════════════════════════════════════════════════════════════════════
  build-push-release:
    name: "Build & Push Registry Privado (release)"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/release'
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Obtener SHA corto del commit
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Normalizar REGISTRY_HOST
        run: |
          CLEAN="$(printf '%s' '${{ secrets.REGISTRY_HOST }}' | tr -d '\r\n\t ')"
          echo "REGISTRY_HOST_CLEAN=$CLEAN" >> $GITHUB_ENV

      - name: Config buildkit para registry HTTP
        run: |
          printf '[registry."%s"]\n  http = true\n  insecure = true\n' "$REGISTRY_HOST_CLEAN" > /tmp/buildkitd.toml

      - name: Configurar buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-config: /tmp/buildkitd.toml

      - name: Credenciales Docker para Zot
        run: |
          mkdir -p "$HOME/.docker"
          AUTH_B64="$(printf '%s' '${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASS }}' | base64 -w0)"
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY_HOST_CLEAN" "$AUTH_B64" > "$HOME/.docker/config.json"

      - name: Build y push auth-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/auth-service
          push: true
          tags: |
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-auth-service:latest
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-auth-service:${{ steps.vars.outputs.sha_short }}

      - name: Build y push localidades-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/localidades-service
          push: true
          tags: |
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-localidades-service:latest
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-localidades-service:${{ steps.vars.outputs.sha_short }}

      - name: Build y push funciones-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/funciones-service
          push: true
          tags: |
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-funciones-service:latest
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-funciones-service:${{ steps.vars.outputs.sha_short }}

      - name: Build y push reservas-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/reservas-service
          push: true
          tags: |
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-reservas-service:latest
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-reservas-service:${{ steps.vars.outputs.sha_short }}

      - name: Build y push pagos-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/pagos-service
          push: true
          tags: |
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-pagos-service:latest
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-pagos-service:${{ steps.vars.outputs.sha_short }}

      - name: Build y push escaneo-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/escaneo-service
          push: true
          tags: |
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-escaneo-service:latest
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-escaneo-service:${{ steps.vars.outputs.sha_short }}

      - name: Build y push api-gateway
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: true
          tags: |
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-api-gateway:latest
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-api-gateway:${{ steps.vars.outputs.sha_short }}

      - name: Build y push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_GATEWAY_URL=http://${{ secrets.K3S_INGRESS_HOST }}/api
            VITE_RESERVAS_WS_URL=ws://${{ secrets.K3S_INGRESS_HOST }}/socket.io
          tags: |
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-frontend:latest
            ${{ env.REGISTRY_HOST_CLEAN }}/filmstars-frontend:${{ steps.vars.outputs.sha_short }}

  # ════════════════════════════════════════════════════════════════════════════
  # FASE 3b — DEPLOY EN K3S (solo release)
  # Ansible ya instaló K3s y Zot. Aquí solo se aplican los manifiestos.
  # KUBECONFIG_B64 y DB_HOST se configuran manualmente como secrets de GitHub.
  # ════════════════════════════════════════════════════════════════════════════
  deploy-k3s:
    name: "Deploy K3s (release)"
    runs-on: ubuntu-latest
    needs: build-push-release
    if: github.ref == 'refs/heads/release'
    env:
      REGISTRY_HOST:        ${{ secrets.REGISTRY_HOST }}
      IMAGE_TAG:            ${{ needs.build-push-release.outputs.sha_short }}
      DB_SERVER_PRIVATE_IP: ${{ secrets.DB_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.5'

      - name: Configurar kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verificar conexion al cluster
        run: kubectl cluster-info

      - name: Aplicar Namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Aplicar ConfigMaps
        run: envsubst '${DB_SERVER_PRIVATE_IP}' < k8s/configmaps/app-config.yaml | kubectl apply -f -

      - name: Aplicar Secrets
        env:
          POSTGRES_PASSWORD:      ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET:             ${{ secrets.JWT_SECRET }}
          RABBITMQ_USER:          ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS:          ${{ secrets.RABBITMQ_PASS }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
        run: |
          export POSTGRES_PASSWORD_B64=$(echo -n "$POSTGRES_PASSWORD" | base64 -w0)
          export JWT_SECRET_B64=$(echo -n "$JWT_SECRET" | base64 -w0)
          export RABBITMQ_USER_B64=$(echo -n "$RABBITMQ_USER" | base64 -w0)
          export RABBITMQ_PASS_B64=$(echo -n "$RABBITMQ_PASS" | base64 -w0)
          export INTERNAL_SERVICE_TOKEN_B64=$(echo -n "$INTERNAL_SERVICE_TOKEN" | base64 -w0)
          envsubst < k8s/secrets/app-secrets.yaml | kubectl apply -f -

      - name: Secret de credenciales del Registry
        run: |
          kubectl create secret docker-registry registry-credentials \
            --namespace filmstars \
            --docker-server=${{ secrets.REGISTRY_HOST }} \
            --docker-username=${{ secrets.REGISTRY_USER }} \
            --docker-password=${{ secrets.REGISTRY_PASS }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Desplegar microservicios y frontend
        run: |
          for f in k8s/apps/*.yaml; do
            envsubst < "$f" | kubectl apply -f -
          done

      - name: Aplicar Ingress
        run: kubectl apply -f k8s/ingress/

      - name: Verificar rollout
        run: |
          for dep in auth-service localidades-service funciones-service reservas-service pagos-service escaneo-service api-gateway frontend; do
            kubectl rollout status deployment/$dep -n filmstars --timeout=120s || \
              (kubectl rollout undo deployment/$dep -n filmstars && exit 1)
          done

      - name: Estado final
        if: always()
        run: |
          kubectl get pods -n filmstars
          kubectl get ingress -n filmstars
