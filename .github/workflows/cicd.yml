name: CI/CD FilmStars

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  check-branch:
    name: Validar rama origen (solo release → main)
    runs-on: ubuntu-latest
    steps:
      - name: Verificar rama de origen
        if: github.base_ref == 'main'
        run: |
          SOURCE="${{ github.head_ref }}"
          echo "Rama origen: $SOURCE"
          if [[ "$SOURCE" != "release" ]]; then
            echo "ERROR: Solo la rama release puede hacer merge a main. Rama detectada: $SOURCE"
            exit 1
          fi
          echo "Rama valida: $SOURCE"

  build-frontend:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest
    needs: check-branch
    steps:
      - uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Subir artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: check-branch
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - localidades-service
          - funciones-service
          - reservas-service
          - pagos-service
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        working-directory: Backend/services/${{ matrix.service }}
        run: npm install --legacy-peer-deps

      - name: Build (compilacion TypeScript)
        working-directory: Backend/services/${{ matrix.service }}
        run: npm run build

  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-services
    strategy:
      fail-fast: false
      matrix:
        service:
          - funciones-service
          - reservas-service
          - pagos-service
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        working-directory: Backend/services/${{ matrix.service }}
        run: npm install --legacy-peer-deps

      - name: Ejecutar tests con cobertura
        working-directory: Backend/services/${{ matrix.service }}
        run: npm run test:cov

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: Backend/services/${{ matrix.service }}/coverage/
          retention-days: 14

  build-gateway:
    name: Build API Gateway
    runs-on: ubuntu-latest
    needs: check-branch
    steps:
      - uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: api-gateway/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: api-gateway
        run: |
          echo "unsafe-perm=true" >> .npmrc
          pnpm install --no-frozen-lockfile

      - name: Build (compilacion TypeScript)
        working-directory: api-gateway
        run: pnpm build

  deploy:
    name: Deploy (EC2)
    runs-on: ubuntu-latest
    needs: [build-frontend, build-services, test-services, build-gateway]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Desplegar en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            docker compose up -d --build
            docker image prune -f
