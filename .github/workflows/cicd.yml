name: CI/CD FilmStars

on:
  push:
    branches: [release, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ══════════════════════════════════════════════════════════════════════
  # FASE 1 — TEST
  # Pruebas unitarias con cobertura mínima del 75%.
  # Si falla: notifica el error y el pipeline se detiene.
  # ══════════════════════════════════════════════════════════════════════
  test:
    name: "Fase 1 · Test ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - auth-service
          - localidades-service
          - funciones-service
          - reservas-service
          - pagos-service
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        working-directory: Backend/services/${{ matrix.service }}
        run: npm install --legacy-peer-deps

      - name: Ejecutar tests con cobertura minima del 75%
        working-directory: Backend/services/${{ matrix.service }}
        run: npm run test:cov

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: Backend/services/${{ matrix.service }}/coverage/
          retention-days: 14

      - name: Notificar fallo de tests
        if: failure()
        run: |
          echo "::error::FASE 1 FALLIDA — ${{ matrix.service }} no alcanzo el 75% de cobertura minima requerida. Pipeline detenido."

  # ══════════════════════════════════════════════════════════════════════
  # FASE 2 — BUILD & PUSH
  # Construye las imagenes Docker y las publica en DockerHub con tag :latest.
  # Si falla: notifica el error y el pipeline se detiene.
  # ══════════════════════════════════════════════════════════════════════
  build-push:
    name: "Fase 2 · Build & Push a DockerHub"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir URL del API Gateway segun rama
        id: vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/release" ]]; then
            echo "api_url=http://${{ secrets.EC2_HOST_VM1 }}:3006" >> $GITHUB_OUTPUT
          else
            echo "api_url=http://localhost:3006" >> $GITHUB_OUTPUT
          fi

      - name: Build y push auth-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/auth-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-auth-service:latest

      - name: Build y push localidades-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/localidades-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-localidades-service:latest

      - name: Build y push funciones-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/funciones-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-funciones-service:latest

      - name: Build y push reservas-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/reservas-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-reservas-service:latest

      - name: Build y push pagos-service
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/services/pagos-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-pagos-service:latest

      - name: Build y push api-gateway
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-api-gateway:latest

      - name: Build y push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_GATEWAY_URL=${{ steps.vars.outputs.api_url }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/filmstars-frontend:latest

      - name: Notificar fallo de build
        if: failure()
        run: |
          echo "::error::FASE 2 FALLIDA — Error al construir o publicar las imagenes Docker. Pipeline detenido."

  # ══════════════════════════════════════════════════════════════════════
  # FASE 3a — DEPLOY AWS (solo rama release)
  # Se conecta via SSH a las VMs y ejecuta docker compose pull + up.
  # Orden: VM3 (bases de datos) → VM2 (servicios) → VM1 (frontend + gateway)
  # ══════════════════════════════════════════════════════════════════════
  deploy-vm3:
    name: "Fase 3 · Deploy VM3 – Bases de datos (AWS)"
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/release'
    steps:
      - name: Desplegar bases de datos en VM3
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_VM3 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin release
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" > .env
            docker compose -f docker-compose.vm3.yml pull
            docker compose -f docker-compose.vm3.yml up -d --force-recreate
            docker image prune -f

  deploy-vm2:
    name: "Fase 3 · Deploy VM2 – Servicios Backend (AWS)"
    runs-on: ubuntu-latest
    needs: deploy-vm3
    if: github.ref == 'refs/heads/release'
    steps:
      - name: Desplegar servicios en VM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_VM2 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin release
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" > .env
            echo "VM3_HOST=${{ secrets.VM3_HOST }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}" >> .env
            echo "RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            docker compose -f docker-compose.vm2.yml pull
            docker compose -f docker-compose.vm2.yml up -d --force-recreate
            docker image prune -f

  deploy-vm1:
    name: "Fase 3 · Deploy VM1 – Frontend + API Gateway (AWS)"
    runs-on: ubuntu-latest
    needs: deploy-vm2
    if: github.ref == 'refs/heads/release'
    steps:
      - name: Desplegar frontend y gateway en VM1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_VM1 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin release
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" > .env
            echo "VM1_HOST=${{ secrets.EC2_HOST_VM1 }}" >> .env
            echo "VM2_HOST=${{ secrets.VM2_HOST }}" >> .env
            docker compose -f docker-compose.vm1.yml pull
            docker compose -f docker-compose.vm1.yml up -d --force-recreate
            docker image prune -f

  # ══════════════════════════════════════════════════════════════════════
  # FASE 3b — DEPLOY LOCAL (solo rama develop)
  # Corre en la maquina del equipo via self-hosted runner.
  # Descarga las imagenes de DockerHub y levanta todos los servicios.
  # ══════════════════════════════════════════════════════════════════════
  deploy-local:
    name: "Fase 3 · Deploy Local – Maquina del equipo (develop)"
    runs-on: self-hosted
    needs: build-push
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Crear archivo .env local
        shell: powershell
        run: |
          $utf8NoBOM = New-Object System.Text.UTF8Encoding $false
          $lines = @(
            "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}",
            "VITE_API_GATEWAY_URL=http://localhost:3006",
            "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}",
            "JWT_SECRET=${{ secrets.JWT_SECRET }}",
            "RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}",
            "RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS }}"
          )
          [System.IO.File]::WriteAllLines(".env", $lines, $utf8NoBOM)

      - name: Pull imagenes desde DockerHub
        run: docker compose pull

      - name: Levantar servicios localmente
        shell: powershell
        run: |
          docker compose down
          $names = @(
            "rabbitmq",
            "auth-service", "localidades-service", "funciones-service", "reservas-service", "pagos-service",
            "api-gateway", "frontend",
            "postgres-auth", "postgres-localidades", "postgres-funciones", "postgres-reservas", "postgres-pagos"
          )
          foreach ($name in $names) {
            docker rm -f $name 2>$null
          }
          docker compose up -d

      - name: Limpiar imagenes antiguas
        run: docker image prune -f
