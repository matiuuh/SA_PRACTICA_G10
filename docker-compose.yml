services:

  # ─── Backend Services ──────────────────────────────────────────────
  auth-service:
    image: ${DOCKERHUB_USERNAME}/filmstars-auth-service:latest
    build:
      context: ./Backend/services/auth-service
    container_name: auth-service
    environment:
      PORT: 3001
      DB_HOST: ${DB_HOST}
      DB_PORT: 5433
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: auth_service
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      DEFAULT_ROLE: CLIENTE
    ports:
      - '3001:3001'
    networks:
      - filmstars-network

  localidades-service:
    image: ${DOCKERHUB_USERNAME}/filmstars-localidades-service:latest
    build:
      context: ./Backend/services/localidades-service
    container_name: localidades-service
    environment:
      PORT: 3002
      DB_HOST: ${DB_HOST}
      DB_PORT: 5434
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: localidades_service
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '3002:3002'
    networks:
      - filmstars-network

  funciones-service:
    image: ${DOCKERHUB_USERNAME}/filmstars-funciones-service:latest
    build:
      context: ./Backend/services/funciones-service
    container_name: funciones-service
    environment:
      PORT: 3003
      DB_HOST: ${DB_HOST}
      DB_PORT: 5435
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: funciones_db
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '3003:3003'
    networks:
      - filmstars-network

  reservas-service:
    image: ${DOCKERHUB_USERNAME}/filmstars-reservas-service:latest
    build:
      context: ./Backend/services/reservas-service
    container_name: reservas-service
    environment:
      PORT: 3004
      DB_HOST: ${DB_HOST}
      DB_PORT: 5436
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: reservas_service
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@${DB_HOST}:5672
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      FUNCIONES_SERVICE_URL: http://funciones-service:3003
    ports:
      - '3004:3004'
    networks:
      - filmstars-network

  pagos-service:
    image: ${DOCKERHUB_USERNAME}/filmstars-pagos-service:latest
    build:
      context: ./Backend/services/pagos-service
    container_name: pagos-service
    environment:
      PORT: 3005
      DB_HOST: ${DB_HOST}
      DB_PORT: 5437
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: pagos_service
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@${DB_HOST}:5672
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '3005:3005'
    networks:
      - filmstars-network

  escaneo-service:
    image: ${DOCKERHUB_USERNAME}/filmstars-escaneo-service:latest
    build:
      context: ./Backend/services/escaneo-service
    container_name: escaneo-service
    environment:
      PORT: 3007
      JWT_SECRET: ${JWT_SECRET}
      RESERVAS_SERVICE_URL: http://reservas-service:3004
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    ports:
      - '3007:3007'
    networks:
      - filmstars-network

  # ─── API Gateway ───────────────────────────────────────────────────
  api-gateway:
    image: ${DOCKERHUB_USERNAME}/filmstars-api-gateway:latest
    build:
      context: ./api-gateway
    container_name: api-gateway
    environment:
      PORT: 3006
      AUTH_SERVICE_URL: http://auth-service:3001
      LOCALIDADES_SERVICE_URL: http://localidades-service:3002
      FUNCIONES_SERVICE_URL: http://funciones-service:3003
      RESERVAS_SERVICE_URL: http://reservas-service:3004
      PAGOS_SERVICE_URL: http://pagos-service:3005
      ESCANEO_SERVICE_URL: http://escaneo-service:3007
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - '3006:3006'
    depends_on:
      - auth-service
      - localidades-service
      - funciones-service
      - reservas-service
      - pagos-service
      - escaneo-service
    networks:
      - filmstars-network

  # ─── Frontend ──────────────────────────────────────────────────────
  frontend:
    image: ${DOCKERHUB_USERNAME}/filmstars-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:3006}
    container_name: frontend
    ports:
      - '5173:80'
    depends_on:
      - api-gateway
    networks:
      - filmstars-network

networks:
  filmstars-network:
    driver: bridge
